[Messages]
JSON_PARSING=தவறான JSON, வரி {line}, நெடுவரிசை {column} இல் பிழை: {message}
VALUE_PARSING=மதிப்பை '{type}' ஆக டிகோட் செய்ய முடியவில்லை
NULL_VALUE=வெற்று மதிப்பு
OUTSIDE_RANGE=மதிப்பு {value} எதிர்பார்க்கப்பட்ட வரம்பிற்கு வெளியே உள்ளது
INVALID_LENGTH=நீளம் {length} எதிர்பார்க்கப்பட்ட வரம்பிற்கு வெளியே உள்ளது
UNKNOWN_LITERAL=தெரியாத மதிப்பு
INVALID_ENUM=மதிப்பு ஒரு சரமாக இருக்க வேண்டும்
INVALID_FORMAT=உள்ளடக்கம் எதிர்பார்க்கப்பட்ட வடிவத்தில் இல்லை
MISSING_FIELD=புலம் '{field}' காணவில்லை
INVALID_ARRAY=பட்டியலாக இருக்க வேண்டும்
INVALID_OBJECT=பொருளாக இருக்க வேண்டும்

[Prefixes]
FIELD=புலம் '{assignee}'
OBJECT=பொருள் '{assignee}'
ARRAY=பட்டியல் '{assignee}' இல் குறியீடு {index}
ROOT=மூல மட்டத்தில்
