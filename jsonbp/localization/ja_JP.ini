NULL_VALUE=null値
OUTSIDE_RANGE=値{value}は期待される範囲外です
INVALID_LENGTH=長さ{length}は期待される範囲外です
UNKNOWN_LITERAL=不明な値
INVALID_ENUM=値は文字列である必要があります
INVALID_FORMAT=コンテンツが期待される形式ではありません
MISSING_FIELD=フィールド'{field}'が見つかりません
INVALID_ARRAY=リストである必要があります
INVALID_OBJECT=オブジェクトである必要があります

[Prefixes]
FIELD=フィールド'{assignee}'
OBJECT=オブジェクト'{assignee}'
